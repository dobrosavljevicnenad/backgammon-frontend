<div class="auth-page">

  <h1 class="title">BACKGAMMON</h1>

  <form class="auth-card" (ngSubmit)="login()">

    <h2>Login</h2>

    @if (registered && !errorMessage()) {
      <p class="success">
        Account created. You can log in now.
      </p>
    }

    <input
      type="email"
      placeholder="Email"
      autocomplete="email"
      [(ngModel)]="email"
      name="email"
    />

    <input
      type="password"
      placeholder="Password"
      autocomplete="current-password"
      [(ngModel)]="password"
      name="password"
    />

    @if (errorMessage()) {
      <p class="error">
        {{ errorMessage() }}
      </p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Logging in...' : 'Login' }}
    </button>

    <a routerLink="/register">
      Don't have an account? Register
    </a>

  </form>

</div>
