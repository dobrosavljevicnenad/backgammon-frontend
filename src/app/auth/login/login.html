<div class="auth-page">

  <h1 class="title">BACKGAMMON</h1>

  <div class="auth-card">

    <h2>Login</h2>

 <input
  type="text"
  placeholder="Username"
  [(ngModel)]="username"
  name="username"
/>

<input
  type="password"
  placeholder="Password"
  [(ngModel)]="password"
  name="password"
/>
@if(errorMessage){
  <p class="error">
    {{ errorMessage }}
  </p>
}
                <button (click)="login()">
                Login
                </button>

    <a routerLink="/register">
      Don't have an account? Register
    </a>

  </div>

</div>
