<div class="auth-page">

  <h1 class="title">BACKGAMMON</h1>

  <form class="auth-card" (ngSubmit)="register()">

    <h2>Create Account</h2>

    <input
      type="text"
      placeholder="Username"
      autocomplete="username"
      [(ngModel)]="username"
      name="username"
    />

<input
  type="email"
  placeholder="Email"
  [(ngModel)]="email"
  name="email"
  [class.invalid]="email && !isEmailValid()"
/>

    <input
      type="password"
      placeholder="Password"
      autocomplete="new-password"
      [(ngModel)]="password"
      name="password"
    />

  <input
  type="password"
  placeholder="Confirm Password"
  autocomplete="new-password"
  [(ngModel)]="confirmPassword"
  name="confirmPassword"
  [class.invalid]="confirmPassword && password !== confirmPassword"
/>

    @if (errorMessage()) {
      <p class="error">
        {{ errorMessage() }}
      </p>
    }

    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating account...' : 'Register' }}
    </button>

    <a routerLink="/login">
      Already have an account?
    </a>

  </form>

</div>
